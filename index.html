<script>
  /* delegated from the document so it works however the page is loaded */
  (function () {
    let replaying = false;
    let userHidden = false;   /* set only by pressing "Hide controls" */
    const fitted = () => document.body.dataset.boxFitted === '1';
    function open(btn, legend) {
      legend.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
      btn.textContent = 'Hide controls';
    }
    function shut(btn, legend) {
      legend.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
      btn.textContent = 'Controls';
    }
    /* with the box fitted the sheet stays expanded until it is hidden by hand */
    new MutationObserver(() => {
      const legend = document.getElementById('legend');
      const btn = document.getElementById('menu-toggle');
      if (!btn || !legend) return;
      if (fitted() && !userHidden && !legend.classList.contains('open')) open(btn, legend);
    }).observe(document.body, { attributes: true, attributeFilter: ['data-box-fitted'] });
    document.addEventListener('click', e => {
      const legend = document.getElementById('legend');
      const btn = document.getElementById('menu-toggle');
      if (!btn || !legend) return;
      if (e.target.closest('#menu-toggle')) {
        const isOpen = legend.classList.toggle('open');
        userHidden = !isOpen;
        btn.setAttribute('aria-expanded', String(isOpen));
        btn.textContent = isOpen ? 'Hide controls' : 'Controls';
        return;
      }
      /* on mobile the sheet also closes on Done or a tap on the scrim */
      if (e.target.closest('#menu-close') || e.target.closest('#scrim')) {
        userHidden = true;
        shut(btn, legend);
        return;
      }
      const hit = e.target.closest('#legend .btn');
      if (!hit || replaying || getComputedStyle(btn).display === 'none') return;
      /* close the sheet first, then let the action run, so the model is already
         in view when it starts moving — but with the box in, leave it open */
      if (fitted() && !userHidden) return;
      e.preventDefault();
      e.stopPropagation();
      shut(btn, legend);
      setTimeout(() => {
        replaying = true;
        hit.click();
        replaying = false;
      }, 220);
    }, true);
  })();
</script>
