<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>myCampal — Ford Tourneo Custom</title>
<link rel="stylesheet" href="_ds/organic-38fa8e91-4870-4476-9e42-06181d6c2941/styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  three-d-stage:not(:defined){visibility:hidden}
  body{margin:0;background:var(--color-bg);min-height:100vh}
  .wrap{display:flex;flex-direction:column;height:100dvh;overflow:hidden;padding:var(--space-4) var(--space-6);box-sizing:border-box;gap:var(--space-4)}
  .head{flex:0 0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-4);overflow:visible}
  h1{font-family:var(--font-heading);font-size:20px;margin:0;line-height:1.2;flex:0 0 auto;white-space:nowrap}
  .legend{flex:0 1 auto;display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3)}
  .legend .group{display:flex;flex-wrap:nowrap;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:999px;background:var(--color-neutral-200)}
  .legend .btn{white-space:nowrap}
  .legend .tag{white-space:nowrap}
  .stage-wrap{position:relative;flex:1 1 0;min-height:260px;display:flex;overflow:hidden}
  .callout{position:absolute;left:0;top:0;width:140px;margin:0;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .18s linear}
  .callout .bubble{width:140px;height:140px;pointer-events:none;border-radius:50%;overflow:hidden;border:5px solid var(--color-bg);box-shadow:var(--shadow-lg);background:var(--color-neutral-200);transform-origin:center;transition:transform .18s ease-out,box-shadow .18s ease-out}
  .callout .bubble:hover{transform:scale(1.85);box-shadow:var(--shadow-lg),0 0 0 1px var(--color-neutral-300)}
  .callout:has(.bubble:hover){z-index:4}
  .callout img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.82) contrast(.96) brightness(1.03)}
  #pins .pin{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--color-accent);color:var(--color-bg);font-family:var(--font-heading);font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);opacity:0;transition:opacity .25s;pointer-events:none}
  .callout .badge{position:absolute;left:-6px;top:-6px;z-index:2;width:36px;height:36px;border-radius:50%;background:var(--color-accent);color:var(--color-bg);font-family:var(--font-heading);font-size:17px;display:flex;align-items:center;justify-content:center;border:3px solid var(--color-bg);box-shadow:var(--shadow-sm)}
  .callout .dot{position:absolute;border-radius:50%;background:var(--color-bg);box-shadow:var(--shadow-sm)}
  .callout .dot.d1{width:26px;height:26px;right:2px;bottom:26px}
  .callout .dot.d2{width:14px;height:14px;right:-16px;bottom:2px}
  three-d-stage{flex:1 1 0;min-height:0;height:100%;align-self:stretch;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-md)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>myCampal Ford Tourneo Custom</h1>
    </div>
    <div class="legend">
      <span class="group">
        <button id="drawer-toggle" class="btn btn-secondary" type="button">Open drawers</button>
        <button id="bed-toggle" class="btn btn-secondary" type="button">Unfold bed</button>
        <button id="lounge-toggle" class="btn btn-secondary" type="button">Lounger</button>
        <button id="table-toggle" class="btn btn-secondary" type="button">Stow table</button>
      </span>
      <span class="group">
        <button id="doors-toggle" class="btn btn-secondary" type="button">Open doors</button>
        <button id="seats-out-toggle" class="btn btn-secondary" type="button">Remove 4 seats</button>
        <button id="front-seats-out-toggle" class="btn btn-secondary" type="button">Remove 2 seats</button>
      </span>
      <button id="van-toggle" class="btn btn-ghost" type="button">Hide van</button>
    </div>
  </div>
  <div class="stage-wrap">
    <three-d-stage name="tourneo-camping-box" autorotate></three-d-stage>
    <div id="pins"></div>
    <figure class="callout" data-drawer="1">
      <span class="badge">1</span>
      <div class="bubble"><img src="uploads/pasted-1788446060900-0.png" alt="Photograph of a camping box kitchen drawer with a twin-burner stove and side table"></div>
      <div class="dot d1"></div>
      <div class="dot d2"></div>
    </figure>
    <figure class="callout" data-drawer="2">
      <span class="badge">2</span>
      <div class="bubble"><img src="uploads/pasted-1788476671781-0.png" alt="Deep open storage crate with hand-hole cut-outs in the bottom-left drawer"></div>
      <div class="dot d1"></div>
      <div class="dot d2"></div>
    </figure>
    <figure class="callout" data-drawer="3">
      <span class="badge">3</span>
      <div class="bubble"><img src="uploads/pasted-1788475134979-0.png" alt="Pull-out tray with a collapsible washing-up bowl in the top-right drawer"></div>
      <div class="dot d1"></div>
      <div class="dot d2"></div>
    </figure>
    <figure class="callout" data-drawer="4">
      <span class="badge">4</span>
      <div class="bubble"><img src="uploads/pasted-1788467399500-0.png" alt="Slide-out compressor fridge in the bottom-right drawer"></div>
      <div class="dot d1"></div>
      <div class="dot d2"></div>
    </figure>
    <figure class="callout" data-drawer="5">
      <span class="badge">5</span>
      <div class="bubble"><img src="uploads/pasted-1788502782458-0.png" alt="Dark-faced ply panel with two chrome rails, slid out of the middle bay as a shelf"></div>
      <div class="dot d1"></div>
      <div class="dot d2"></div>
    </figure>
  </div>
</div>
<script src="./image-slot.js"></script>
<script src="./three-d-stage.js"></script>
<script type="module" src="./camping-box-model.js"></script>
</body>
</html>
